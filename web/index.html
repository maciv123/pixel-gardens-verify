<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel Gardens Verification</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f1419;
      color: #e7e9ea;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1a1f26;
      border: 1px solid #2f3336;
      border-radius: 16px;
      padding: 32px;
      max-width: 480px;
      width: 100%;
    }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    p { color: #8b98a5; line-height: 1.5; }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      background: #00aa55;
      color: white;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary { background: #2f3336; }
    #status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }
    #status.error { display: block; background: #3d1f1f; color: #ff8a8a; }
    #status.success { display: block; background: #1f3d2a; color: #8affaa; }
    #status.info { display: block; background: #1f2a3d; color: #8ab4ff; }
    .wallet { font-family: monospace; font-size: 0.85rem; word-break: break-all; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Pixel Gardens Verify</h1>
    <p>Connect your wallet on Robinhood Chain to prove you hold a Pixel Gardens NFT.</p>
    <p id="wallet-display" class="wallet"></p>
    <button id="connect-btn">Connect Wallet</button>
    <button id="verify-btn" disabled>Sign & Verify</button>
    <div id="status"></div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
